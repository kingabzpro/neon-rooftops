<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Rooftops — endless runner</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #07081a;
    font-family: "Courier New", monospace;
  }
  h1 {
    margin: 0; font-size: 18px; letter-spacing: 6px; color: #7ef0ff;
    text-transform: uppercase;
  }
  canvas {
    width: min(900px, 96vw); image-rendering: pixelated; image-rendering: crisp-edges;
    border: 2px solid #2b2f50; border-radius: 4px;
    background: #0b0d24; touch-action: manipulation; cursor: pointer;
  }
  p { margin: 0; font-size: 12px; color: #565e8c; letter-spacing: 1px; }
  p b { color: #8b93c9; }
</style>
</head>
<body>
  <h1>Neon Rooftops</h1>
  <canvas id="game" width="900" height="300"></canvas>
  <p><b>SPACE / ↑</b> jump &nbsp;·&nbsp; <b>↓</b> dive &nbsp;·&nbsp; <b>SPACE / ENTER / TAP</b> start &amp; retry</p>
  <script src="game.js"></script>
</body>
</html>
